[package]
name = "maxbot"
version = "3.0.6"
description = "MaxBot — a MiniMax-powered desktop chat, tool, and Computer Use client."
authors = ["Tyler Martinez"]
edition = "2021"
rust-version = "1.75"
# v3.0.0 — Tauri 2's `cargo tauri build` cannot infer the
# main binary when the workspace has more than one `[[bin]]`
# (the daemon `maxbotd` and the implicit `maxbot` from
# `src/main.rs`). Without this, the bundler errors out
# with "failed to find main binary, make sure you have a
# `package > default-run` in the Cargo.toml file".
default-run = "maxbot"

[lib]
name = "maxbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# v2.8.0 — Always-on Daemon (24/7). `maxbotd` is the
# headless server-side binary that runs on the user's
# Linux server (`crispy`). It shares the same source tree
# (this Cargo.toml) and the same `maxbot_lib` lib
# crate as the Tauri app — same Database, same executor,
# same scheduler logic. The Tauri `maxbot` app is built
# implicitly from `src/main.rs` (or `src/lib.rs`); the
# daemon is wired through the standard cargo `[[bin]]`
# mechanism.
[[bin]]
name = "maxbotd"
path = "src/bin/maxbotd.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
futures-util = "0.3"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
cron = "0.12"
uuid = { version = "1.10", features = ["v4", "serde"] }
eventsource-stream = "0.2"
url = "2.5"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
sha2 = "0.10"
base64 = "0.22"

# v2.0 — ComputerManager: SSH into the per-Bot Linux VM, drive libvirt
# over SSH on the user's Ubuntu server, encrypt per-Bot SSH keypairs
# with chacha20poly1305 keyed by Argon2id from a user passphrase, and
# proxy noVNC's WebSocket into the VM's RFB over a local SSH -L
# tunnel. The SshPool keeps one entry per Bot.
#
# NOTE: plan called for `russh` + `russh-sftp` for in-process SSH.
# In practice, spawning the OpenSSH `ssh` / `sftp` binaries via
# tokio::process::Command is simpler, uses the OS keychain / ssh-agent
# for server-side auth, and works on macOS out of the box. The per-Bot
# key is written to a 0600 tempfile in $TMPDIR for the duration of an
# SSH call and unlinked on drop; this trades a small on-disk window
# for a ~1500-crate lighter dep tree and a simpler SFTP path. See
# `computer::ssh` for the trait surface and `computer::keys` for the
# keypair generation/encryption.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"

# v2.8.0 — Always-on Daemon (24/7). `axum` powers the
# `maxbotd` binary's tiny HTTP server: a single
# `POST /hooks/<bot_id>` route with bearer-token auth.
# Plain HTTP only in v2.8 (TLS is a v3.0 polish); the
# bearer token is the only auth.
axum = "0.7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# v2.3.0 — Routines: the `#[ignore]`d scheduler-e2e test
# uses a tmpfile SQLite so multiple ignored runs in the
# same session don't collide. `tempfile` is dev-only;
# production builds never link it.
tempfile = "3.10"
